[package]
name = "rove"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ARM-first phylogenetic likelihood kernel in Rust for morphological inference."
license = "MIT OR Apache-2.0"
repository = "https://github.com/getcortexlabs/rove"
keywords = ["phylogenetics", "likelihood", "simd", "bioinformatics"]
categories = ["science"]

[features]
experimental-repeats = []

[dependencies]
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1

[[bench]]
name = "likelihood"
harness = false

[[bench]]
name = "proposals"
harness = false

[[bench]]
name = "repeats"
harness = false

[[bench]]
name = "informative"
harness = false
