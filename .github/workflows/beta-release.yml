name: Notify beta testers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_id:
        description: Published GitHub release ID to resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rove-beta-release-${{ github.event.release.id || inputs.release_id }}
  cancel-in-progress: false

jobs:
  notify:
    name: Send beta release notices
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Notify active invitations
        env:
          ROVE_RELEASE_ID: ${{ github.event.release.id || inputs.release_id }}
          ROVE_RELEASE_SECRET: ${{ secrets.ROVE_RELEASE_SECRET }}
        run: node scripts/notify-beta.mjs
